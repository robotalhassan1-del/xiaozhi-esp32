name: Build Room Node
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Put the token into the firmware
        env:
          ROOM_TOKEN: ${{ secrets.ROOM_TOKEN }}
        run: |
          if [ -z "$ROOM_TOKEN" ]; then echo "ERROR: the GitHub secret ROOM_TOKEN is missing"; exit 1; fi
          sed -i "s|__ROOM_TOKEN__|${ROOM_TOKEN}|" room_node.ino
      - name: Install PlatformIO
        run: pip install platformio
      - name: Prepare the project
        run: |
          mkdir -p pio/src
          cp room_node.ino pio/src/main.cpp
          sed -i '1i #include <Arduino.h>' pio/src/main.cpp
          cat > pio/platformio.ini <<'INI'
          [env:esp32dev]
          platform = espressif32@6.5.0
          board = esp32dev
          framework = arduino
          lib_deps = bblanchon/ArduinoJson@7.0.4
          INI
      - name: Compile
        run: |
          cd pio
          for i in 1 2 3; do
            pio run && break
            echo "Build failed (try $i of 3), waiting before trying again..."
            sleep 30
            if [ $i -eq 3 ]; then exit 1; fi
          done
          ls -la .pio/build/esp32dev
      - name: Merge into one file (flash at 0x0)
        run: |
          python3 - <<'PY'
          d='pio/.pio/build/esp32dev/'
          rd=lambda p: open(d+p,'rb').read()
          boot=rd('bootloader.bin'); part=rd('partitions.bin'); app=rd('firmware.bin')
          size=((0x10000+len(app))+0xFFF)//0x1000*0x1000
          buf=bytearray(b'\xff'*size)
          buf[0x1000:0x1000+len(boot)]=boot; buf[0x8000:0x8000+len(part)]=part; buf[0x10000:0x10000+len(app)]=app
          import os
          os.makedirs('out',exist_ok=True)
          open('out/room_node.merged.bin','wb').write(buf)
          print('merged', len(buf))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: room-node-firmware
          path: out/room_node.merged.bin
